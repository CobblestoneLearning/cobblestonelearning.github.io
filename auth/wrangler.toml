name = "cobblestone-oauth"
main = "worker.js"
compatibility_date = "2024-11-01"

# Non-secret config. The Client ID is safe to expose; the ALLOWED_ORIGIN locks CORS
# to the live hub so no other site can use this exchange endpoint.
[vars]
GITHUB_CLIENT_ID = "Ov23liHyPVBdzXg8TOYS"               # OAuth App Client ID (public, not secret)
ALLOWED_ORIGIN   = "https://cobblestonelearning.github.io"

# The client SECRET is set out-of-band (never commit it):
#   wrangler secret put GITHUB_CLIENT_SECRET
