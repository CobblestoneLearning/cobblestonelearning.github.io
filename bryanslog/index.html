<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- The same policy as the hub. The log's frame inherits it, so keep it as loose as the hub's (the log is tested there). -->
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex, nofollow" />
<!-- SECURITY: this page holds a sign-in token, so it is never shown inside another site's frame (as index.html). -->
<style id="fb">html{display:none!important}</style>
<script>if (self === top) { var fb = document.getElementById('fb'); fb.parentNode.removeChild(fb); } else { try { top.location = self.location; } catch (e) {} }</script>
<noscript><style>html{display:block!important}</style></noscript>
<title>Bryan's Log</title>
<link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="../apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
<!-- Bryan's Log at its own address. This page holds nothing from the log: assets/fullpage.js signs the viewer in
     with GitHub, fetches bryans-log.html from the private bryansLog repo with the viewer's own token, and shows it
     in a sealed frame that fills the window. A viewer without access to the repo sees nothing from it. -->
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #F8F9FB; color: #3D3D3D; font-family: 'Montserrat', Helvetica, Arial, sans-serif; }
  .gate { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; }
  .gate[hidden] { display: none; }
  .gate-box { width: 100%; max-width: 460px; background: #fff; border: 1px solid #E8ECF0; border-radius: 16px; padding: 32px 28px; text-align: center; box-sizing: border-box; }
  .gate-logo { height: 64px; width: auto; margin-bottom: 20px; }
  .gate-spin { width: 28px; height: 28px; margin: 4px auto 16px; border: 3px solid #E8ECF0; border-top-color: #27AAE1; border-radius: 50%; animation: s 0.8s linear infinite; }
  .gate-spin[hidden] { display: none; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .gate-spin { animation: none; } }
  .gate h1 { font-size: 20px; font-weight: 700; margin: 0 0 12px; }
  .gate p { font-size: 15px; line-height: 1.6; margin: 0 0 12px; }
  .gate-btn { margin-top: 8px; border: 0; border-radius: 999px; padding: 12px 22px; font: 700 15px 'Montserrat', Helvetica, Arial, sans-serif; color: #fff; background: linear-gradient(135deg, #0074B4, #005C90); cursor: pointer; }
  .gate-btn:hover { background: #005C90; }
  .gate-btn:focus-visible, .gate a:focus-visible { outline: 3px solid #FFC20E; outline-offset: 3px; }
  .gate a { color: #0074B4; font-weight: 700; }
  .gate-note { margin-top: 16px !important; font-size: 13px !important; color: #6B6B6B; }
  .page-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
</style>
</head>
<body data-repo="bryansLog" data-path="bryans-log.html" data-name="Bryan's Log" data-title="Bryan's Log" data-hash-attr="data-log-hash">
<main id="gate" class="gate">
  <div class="gate-box" aria-busy="true">
    <img class="gate-logo" src="../cobblestone-logo.png" alt="Cobblestone Learning" />
    <div class="gate-spin" aria-hidden="true"></div>
    <div class="gate-msg" role="status" aria-live="polite"><p>Opening Bryan's Log…</p></div>
  </div>
</main>
<noscript><p style="text-align:center">This page needs JavaScript.</p></noscript>
<script src="../assets/fullpage.js?v=1"></script>
</body>
</html>
