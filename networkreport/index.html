<!-- The network report's short address. It only forwards to the report's own page on cobblestone-private-pages, which signs
     the viewer in with GitHub and shows the report as the real page, built live from the private repo
     cobblestone-network-report. This page holds nothing from the report. A #section in the address is passed on. -->
<script>(function () { var h = /^#[\w\-\/.:%?=&]{0,300}$/.test(location.hash) ? location.hash : ''; location.replace('https://cobblestone-private-pages.cobblestonelearning.workers.dev/networkreport/' + h); })();</script>
<style>body{font-family:Montserrat,Helvetica,Arial,sans-serif;color:#3D3D3D;max-width:560px;margin:15vh auto;padding:0 20px;line-height:1.6}a{color:#0074B4;font-weight:700}</style>
</head>
<body>
<h1 style="font-size:22px">Opening the network report</h1>
<p>If the report does not open, select <a href="https://cobblestone-private-pages.cobblestonelearning.workers.dev/networkreport/">Open the network report</a>.</p>
</body>
</html>
